# Known, accepted differences: phase -> model -> check -> reason. See e2e/xfails.py.
# Every entry is a strict xfail: once the difference is gone, remove the entry.
#
# Phase "greensloth": green-sloth's model.ts files are authored independently of
# mxl-models (mxl-models ADR 0004). The entries below are drift found on
# 2026-10-26; they are fixed by regenerating / updating the green-sloth models,
# never by hand-editing either side to make this suite pass.

[greensloth.davis2017]
structure = "mxl-models has derived K_deltaG, green-sloth doesn't"
values = "PPFD default: green-sloth 100, mxl-models 0"
args = "PPFD default differs (see values), plus missing K_deltaG"

