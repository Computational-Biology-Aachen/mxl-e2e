[project]
name = "mxl-e2e"
version = "0.1.0"
description = "End-to-end tests of the mxl codegen pipeline (mxlpy <-> mxlweb-core)."
requires-python = ">=3.13"
dependencies = ["mxlmodels", "mxlpy"]

[dependency-groups]
dev = ["pytest>=8.3.3", "pytest-xdist>=3.8.0", "ruff>=0.16.9"]

[tool.uv]
package = false
exclude-newer = "3 days"
exclude-newer-package = { mxlpy = false, mxlmodels = false }

# Mirrors the 0-admin meta-repo layout, so the suite tests the sibling working
# trees (CI checks the repos out into the same layout).
[tool.uv.sources]
mxlmodels = { path = "../../pkg-py/mxl-models", editable = true }
mxlpy = { path = "../../pkg-py/MxlPy", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D", "E501", "S101", "PLR2004", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["INP001"]
